<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Library</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c69b6d">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161c;
            --text-main: #e4d8c5;
            --text-muted: #a3a19e;
            --gold-accent: #f8b700;
            --gold-muted: #c69b6d;
            --gold-border: #4a3a25;
            --read-bg: rgba(13, 26, 19, 0.85);
            --read-border: #224d31;
            --danger: #7a1d1d;
            --ui-font: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #1a1c23 0%, #0b0c10 100%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 16px;
            line-height: 1.5;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--gold-border);
            padding-bottom: 16px;
            background: linear-gradient(90deg, transparent, rgba(198, 155, 109, 0.1), transparent);
        }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--gold-muted);
            box-shadow: 0 0 10px rgba(198, 155, 109, 0.3);
        }

        h1 {
            color: var(--gold-accent);
            font-family: var(--ui-font);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: rgba(21, 22, 28, 0.8);
            border: 1px solid var(--gold-border);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--gold-muted);
        }

        .btn-secondary {
            flex: 1;
            background: linear-gradient(to bottom, #2a2c35, #1a1c23);
            border: 1px solid var(--gold-border);
            color: var(--gold-muted);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--ui-font);
            text-transform: uppercase;
            font-weight: bold;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .book-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--gold-border);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        /* Active Drag Styling */
        .book-card.dragging {
            opacity: 0.95;
            box-shadow: 0 15px 30px rgba(0,0,0,0.9);
            z-index: 1000;
        }

        .book-card.placeholder {
            border: 2px dashed var(--gold-muted);
            background-color: rgba(198, 155, 109, 0.05);
            box-shadow: none;
            transition: height 0.2s ease;
        }

        .book-card.read {
            border-color: var(--read-border);
        }

        /* Blurred Background Overlay */
        .bg-blur {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.25);
            z-index: 0;
            pointer-events: none;
        }

        .book-card.read .bg-blur {
            filter: blur(25px) brightness(0.15) sepia(0.5) hue-rotate(90deg);
        }

        .book-cover, .book-info {
            position: relative;
            z-index: 1;
        }

        .book-cover {
            flex-shrink: 0;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- MINIMIZED STATE (List View) --- */
        .book-card.minimized .book-cover {
            width: 130px;
            height: 195px;
        }
        .book-card.minimized .book-synopsis,
        .book-card.minimized .book-actions,
        .book-card.minimized .book-rating,
        .book-card.minimized .book-metadata {
            display: none;
        }
        .book-card.minimized .book-title {
            font-size: 1.55rem;
            line-height: 1.1;
            margin-top: 8px;
        }

        /* --- UNMINIMIZED STATE (Full Screen Modal) --- */
        .book-card:not(.minimized) {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            z-index: 9999;
            flex-direction: column;
            border-radius: 0;
            margin: 0;
            overflow-y: auto;
            border: none;
            background-color: #0b0c10;
        }
        .book-card:not(.minimized) .bg-blur {
            position: fixed; 
            filter: blur(40px) brightness(0.2);
        }
        .book-card:not(.minimized) .book-cover {
            width: 100%;
            height: 45vh;
            border-right: none;
            border-bottom: 2px solid var(--gold-border);
            flex-shrink: 0;
        }
        .book-card:not(.minimized) .book-cover img {
            object-fit: contain; 
            padding: 16px;
            background: rgba(0,0,0,0.6);
        }
        .book-card:not(.minimized) .drag-handle {
            display: none;
        }
        .book-card:not(.minimized) .card-indicator {
            font-size: 2rem; 
            color: #fff;
        }
        .book-card:not(.minimized) .book-title {
            font-size: 1.8rem;
            line-height: 1.2;
            margin-bottom: 12px;
        }
        .book-card:not(.minimized) .book-actions {
            margin-top: 24px;
            margin-bottom: 32px;
            padding-bottom: 24px;
        }

        .book-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 4px;
        }

        .drag-handle {
            color: var(--gold-muted);
            font-size: 1.5rem;
            cursor: grab;
            user-select: none;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            touch-action: none;
        }
        .drag-handle:active { cursor: grabbing; }

        .header-text { flex-grow: 1; }

        .category-tag {
            font-size: 0.75rem;
            color: var(--gold-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .card-indicator {
            font-size: 1.5rem;
            color: var(--gold-muted);
            flex-shrink: 0;
            text-align: right;
            line-height: 1;
            font-weight: 300;
        }

        .book-title {
            font-family: var(--ui-font);
            font-weight: bold;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            transition: all 0.2s ease;
        }

        .book-metadata {
            font-size: 0.9rem;
            color: #bbb;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 16px;
        }
        .book-metadata span {
            color: #fff;
            font-weight: bold;
        }

        .book-rating {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .star { color: var(--gold-accent); }

        .book-synopsis {
            font-size: 1rem;
            color: #d1d1d1;
            margin-bottom: 16px;
            flex-grow: 1;
            line-height: 1.6;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .book-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        button.action-btn {
            flex: 1;
            padding: 14px;
            border: 1px solid transparent;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            font-family: var(--ui-font);
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .btn-read { 
            background: linear-gradient(to bottom, #d4a976, #b0814a); 
            color: #2a1f12; 
            border-color: #f8b700;
        }
        .book-card.read .btn-read { 
            background: linear-gradient(to bottom, #2b6140, #1c452b); 
            color: #a3d9b8; 
            border-color: #3e8a5a;
        }

        .btn-hide { 
            background: linear-gradient(to bottom, #8a2525, #5c1616); 
            color: #f0caca;
            border-color: #a33535;
        }

    </style>
</head>
<body>

    <header>
        <img src="Images/icon.svg" alt="WoW Library Logo" class="header-logo" onerror="this.style.display='none'">
        <h1>WoW Library</h1>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by title or category...">
        <div class="button-group">
            <button class="btn-secondary" onclick="toggleAllMinimize()">Toggle Minimize</button>
            <button class="btn-secondary" onclick="resetHidden()">Show Hidden</button>
        </div>
    </div>

    <main class="book-list" id="bookContainer"></main>

    <script>
        const colorSilver = "#c0c5ce";
        const colorGold = "#f0c265";
        const colorIce = "#84cce3";
        const colorFel = "#73e041";
        const colorFire = "#d65a31";

        let books = [
            { id: 1, title: "Rise of the Horde", titleColor: colorSilver, category: "The Foundations", author: "Christie Golden", date: "Dec 2006", rating: "4.21", synopsis: "Before the Dark Portal opened, the Orcs were a shamanic society on Draenor. Details their tragic fall into bloodlust orchestrated by the Burning Legion.", cover: "Images/rise-of-the-horde.jpg" },
            { id: 2, title: "The Last Guardian", titleColor: colorSilver, category: "The Foundations", author: "Jeff Grubb", date: "Dec 2001", rating: "4.12", synopsis: "The wizard Medivh struggles against a dark presence. His apprentice, Khadgar, must uncover his secrets as the Horde pours into Azeroth.", cover: "Images/the-last-guardian.jpg" },
            { id: 3, title: "Tides of Darkness", titleColor: colorGold, category: "The Foundations", author: "Aaron Rosenberg", date: "Aug 2007", rating: "4.15", synopsis: "Following the fall of Stormwind, survivors flee to Lordaeron to forge a grand Alliance and halt the Orcish Horde's march.", cover: "Images/tides-of-darkness.jpg" },
            { id: 4, title: "Beyond the Dark Portal", titleColor: colorGold, category: "The Foundations", author: "Aaron Rosenberg & Christie Golden", date: "Apr 2008", rating: "4.13", synopsis: "The Alliance expedition pushes through the portal into Draenor to stop the orcish threat at its source.", cover: "Images/beyond-the-dark-portal.jpg" },
            { id: 5, title: "Day of the Dragon", titleColor: colorGold, category: "The Foundations", author: "Richard A. Knaak", date: "Feb 2001", rating: "4.05", synopsis: "Set after the Second War, focusing on the mage Rhonin and the liberation of the Dragonqueen Alexstrasza from the Dragonmaw Clan.", cover: "Images/day-of-the-dragon.jpg" },
            { id: 6, title: "The Well of Eternity", titleColor: colorSilver, category: "Time Travel & 3rd War", author: "Richard A. Knaak", date: "Mar 2004", rating: "4.20", synopsis: "Modern heroes are cast 10,000 years into the past during the Burning Legion's first invasion of Azeroth.", cover: "Images/the-well-of-eternity.jpg" },
            { id: 7, title: "The Demon Soul", titleColor: colorFire, category: "Time Travel & 3rd War", author: "Richard A. Knaak", date: "Oct 2004", rating: "4.22", synopsis: "Part two of the War of the Ancients. Deathwing's betrayal is revealed as the defenders of Azeroth struggle to survive.", cover: "Images/the-demon-soul.jpg" },
            { id: 8, title: "The Sundering", titleColor: colorSilver, category: "Time Travel & 3rd War", author: "Richard A. Knaak", date: "Jul 2005", rating: "4.26", synopsis: "The conclusion to the War of the Ancients. The Well of Eternity collapses, reshaping the continents of Azeroth forever.", cover: "Images/the-sundering.jpg" },
            { id: 9, title: "Lord of the Clans", titleColor: colorGold, category: "Time Travel & 3rd War", author: "Christie Golden", date: "Oct 2001", rating: "4.26", synopsis: "Raised as a gladiator slave, the young orc Thrall escapes to master shamanism and unite the scattered orc clans into a new Horde.", cover: "Images/lord-of-the-clans.jpg" },
            { id: 10, title: "Of Blood and Honor", titleColor: colorSilver, category: "Time Travel & 3rd War", author: "Chris Metzen", date: "Jan 2001", rating: "4.03", synopsis: "The paladin Tirion Fordring risks everything when he makes a fateful connection with the honorable orc Eitrigg.", cover: "Images/of-blood-and-honor.jpg" },
            { id: 11, title: "Arthas: Rise of the Lich King", titleColor: colorIce, category: "Time Travel & 3rd War", author: "Christie Golden", date: "Apr 2009", rating: "4.35", synopsis: "Prince Arthas Menethil makes terrible sacrifices to save his people, a tragic path that leads him to the Frozen Throne.", cover: "Images/arthas-rise-of-the-lich-king.jpg" },
            { id: 12, title: "Illidan", titleColor: colorFel, category: "Time Travel & 3rd War", author: "William King", date: "Apr 2016", rating: "4.24", synopsis: "Follows Illidan Stormrage from his release in Warcraft III through his rule over Outland.", cover: "Images/illidan.jpg" },
            { id: 13, title: "Cycle of Hatred", titleColor: colorSilver, category: "The MMO Era", author: "Keith R.A. DeCandido", date: "Jan 2006", rating: "3.55", synopsis: "Set shortly before Vanilla WoW, exploring the fragile peace between the Horde and Alliance in Kalimdor.", cover: "Images/cycle-of-hatred.jpg" },
            { id: 14, title: "Night of the Dragon", titleColor: colorSilver, category: "The MMO Era", author: "Richard A. Knaak", date: "Nov 2008", rating: "3.95", synopsis: "A sequel to Day of the Dragon, returning to Grim Batol to face the sinister Twilight Dragonflight.", cover: "Images/night-of-the-dragon.jpg" },
            { id: 15, title: "Stormrage", titleColor: "#87c773", category: "The MMO Era", author: "Richard A. Knaak", date: "Feb 2010", rating: "3.90", synopsis: "Malfurion Stormrage is trapped in the Emerald Nightmare, and his allies must fight to awaken him before the corruption spreads.", cover: "Images/stormrage.jpg" },
            { id: 16, title: "The Shattering", titleColor: colorFire, category: "The MMO Era", author: "Christie Golden", date: "Oct 2010", rating: "4.05", synopsis: "As Thrall steps down to heal the world, Garrosh Hellscream takes command, heightening faction tensions.", cover: "Images/the-shattering.jpg" },
            { id: 17, title: "Wolfheart", titleColor: colorSilver, category: "The MMO Era", author: "Richard A. Knaak", date: "Sep 2011", rating: "3.90", synopsis: "King Varian Wrynn struggles to accept the Worgen into the Alliance while Garrosh presses his assault on Ashenvale.", cover: "Images/wolfheart.jpg" },
            { id: 18, title: "Thrall: Twilight of the Aspects", titleColor: colorGold, category: "The MMO Era", author: "Christie Golden", date: "Jul 2011", rating: "4.08", synopsis: "Thrall journeys across time and space to aid the Dragon Aspects in their fight against the Twilight's Hammer.", cover: "Images/thrall-twilight-of-the-aspects.jpg" },
            { id: 19, title: "Jaina Proudmoore: Tides of War", titleColor: colorIce, category: "The MMO Era", author: "Christie Golden", date: "Aug 2012", rating: "4.21", synopsis: "The tragic destruction of Theramore pushes Jaina Proudmoore to the brink, altering her path forever.", cover: "Images/jaina-proudmoore-tides-of-war.jpg" },
            { id: 20, title: "Dawn of the Aspects", titleColor: colorGold, category: "The MMO Era", author: "Richard A. Knaak", date: "Nov 2013", rating: "4.07", synopsis: "Kalecgos experiences visions of the ancient proto-dragons and their original battle against Galakrond.", cover: "Images/dawn-of-the-aspects.jpg" },
            { id: 21, title: "Vol'jin: Shadows of the Horde", titleColor: "#5cb8b2", category: "The MMO Era", author: "Michael A. Stackpole", date: "Jul 2013", rating: "4.22", synopsis: "Recovering from an assassination attempt in Pandaria, Vol'jin must defend a monastery against the Zandalari.", cover: "Images/voljin-shadows-of-the-horde.jpg" },
            { id: 22, title: "War Crimes", titleColor: colorGold, category: "The MMO Era", author: "Christie Golden", date: "May 2014", rating: "4.15", synopsis: "Garrosh Hellscream stands trial in Pandaria, forcing leaders from both factions to confront their own pasts.", cover: "Images/war-crimes.jpg" },
            { id: 23, title: "Before the Storm", titleColor: colorGold, category: "The MMO Era", author: "Christie Golden", date: "Jun 2018", rating: "3.95", synopsis: "Anduin Wrynn and Sylvanas Windrunner attempt to navigate a tenuous peace after the defeat of the Burning Legion.", cover: "Images/before-the-storm.jpg" },
            { id: 24, title: "Shadows Rising", titleColor: "#b08dce", category: "The MMO Era", author: "Madeleine Roux", date: "Jul 2020", rating: "3.85", synopsis: "The Horde and Alliance hunt for Sylvanas and Nathanos in the aftermath of the Fourth War.", cover: "Images/shadows-rising.jpg" },
            { id: 25, title: "Sylvanas", titleColor: "#8e9cb3", category: "The MMO Era", author: "Christie Golden", date: "Mar 2022", rating: "4.32", synopsis: "An intimate look into the long afterlife of the Banshee Queen and her motivations leading into the Shadowlands.", cover: "Images/sylvanas.jpg" },
            { id: 26, title: "War of the Scaleborn", titleColor: colorGold, category: "The MMO Era", author: "Courtney Alameda", date: "Oct 2023", rating: "4.10", synopsis: "An ancient history of the conflict between the empowered Dragon Aspects and the elemental Primalists.", cover: "Images/war-of-the-scaleborn.jpg" },
            { id: 27, title: "Blood Ties", titleColor: "#9b59b6", category: "The MMO Era", author: "TBD", date: "TBA", rating: "TBD", synopsis: "Sets the stage for the Midnight expansion as the void forces prepare to strike at the heart of Azeroth.", cover: "Images/blood-ties.jpg" }
        ];

        let readStatus = JSON.parse(localStorage.getItem('wowBooksRead')) || {};
        let hiddenStatus = JSON.parse(localStorage.getItem('wowBooksHidden')) || {};
        let minStatus = JSON.parse(localStorage.getItem('wowBooksMin')) || {};
        let customOrder = JSON.parse(localStorage.getItem('wowBooksOrder')) || [];

        if (customOrder.length > 0) {
            books.sort((a, b) => {
                let indexA = customOrder.indexOf(a.id);
                let indexB = customOrder.indexOf(b.id);
                if (indexA === -1) indexA = 999; 
                if (indexB === -1) indexB = 999;
                return indexA - indexB;
            });
        }

        books.forEach(book => {
            if (minStatus[book.id] === undefined) {
                minStatus[book.id] = true;
            }
        });

        let allMinimized = true;

        const container = document.getElementById('bookContainer');
        const searchInput = document.getElementById('searchInput');

        function saveState() {
            localStorage.setItem('wowBooksRead', JSON.stringify(readStatus));
            localStorage.setItem('wowBooksHidden', JSON.stringify(hiddenStatus));
            localStorage.setItem('wowBooksMin', JSON.stringify(minStatus));
            
            const isAnyExpanded = Object.values(minStatus).includes(false);
            // DO NOT use document.body.style.overflow = 'hidden' to avoid mobile render bugs
            // Expanding a card now overlays without touching body overflow
        }

        function renderBooks() {
            container.innerHTML = ''; 
            const searchTerm = searchInput.value.toLowerCase();

            books.forEach(book => {
                if (hiddenStatus[book.id]) return;

                if (book.title.toLowerCase().includes(searchTerm) || 
                    book.category.toLowerCase().includes(searchTerm)) {
                    
                    const isRead = readStatus[book.id];
                    const isMin = minStatus[book.id];
                    
                    const card = document.createElement('div');
                    card.className = `book-card ${isRead ? 'read' : ''} ${isMin ? 'minimized' : ''}`;
                    card.dataset.id = book.id;
                    card.onclick = (e) => handleCardClick(e, book.id);
                    
                    card.innerHTML = `
                        <div class="bg-blur" style="background-image: url('${book.cover}')"></div>
                        <div class="book-cover">
                            <img src="${book.cover}" alt="${book.title} Cover" onerror="this.onerror=null; this.src='https://placehold.co/130x195/15161c/c69b6d?text=No+Cover';">
                        </div>
                        <div class="book-info">
                            <div class="card-header">
                                <div class="drag-handle" onclick="event.stopPropagation()">☰</div>
                                <div class="header-text">
                                    <div class="category-tag">${book.category}</div>
                                    <div class="book-title" style="color: ${book.titleColor}">${book.title}</div>
                                </div>
                                <div class="card-indicator">${isMin ? '+' : '✕'}</div>
                            </div>
                            
                            <div class="book-metadata">
                                <div>Author: <br><span>${book.author}</span></div>
                                <div>Published: <br><span>${book.date}</span></div>
                            </div>
                            
                            <div class="book-rating">
                                <span class="star">★</span> ${book.rating} / 5.00
                            </div>
                            
                            <div class="book-synopsis">${book.synopsis}</div>
                            
                            <div class="book-actions">
                                <button class="action-btn btn-read" onclick="event.stopPropagation(); toggleRead(${book.id})">
                                    ${isRead ? '✓ Read' : 'Mark as Read'}
                                </button>
                                <button class="action-btn btn-hide" onclick="event.stopPropagation(); hideBook(${book.id})">Hide</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
            saveState(); 
        }

        window.handleCardClick = function(event, id) {
            if (event.target.tagName === 'BUTTON' || event.target.closest('button') || event.target.classList.contains('drag-handle')) {
                return;
            }
            toggleMin(id);
        };

        window.toggleRead = function(id) {
            readStatus[id] = !readStatus[id];
            saveState();
            renderBooks();
        };

        window.hideBook = function(id) {
            hiddenStatus[id] = true;
            saveState();
            renderBooks();
        };

        window.toggleMin = function(id) {
            minStatus[id] = !minStatus[id];
            saveState();
            renderBooks();
            
            if (!minStatus[id]) {
                setTimeout(() => {
                    const expandedCard = document.querySelector(`.book-card[data-id="${id}"]`);
                    if (expandedCard) expandedCard.scrollTop = 0;
                }, 10);
            }
        };

        window.toggleAllMinimize = function() {
            allMinimized = !allMinimized;
            books.forEach(book => { minStatus[book.id] = allMinimized; });
            saveState();
            renderBooks();
        };

        window.resetHidden = function() {
            hiddenStatus = {};
            saveState();
            renderBooks();
        };

        // Highly robust Mobile Drag & Drop with FLIP Shuffling
        let draggedItem = null;
        let placeholder = null;
        let startY = 0;
        let initialRect = null;

        container.addEventListener('touchstart', (e) => {
            if (e.target.classList.contains('drag-handle')) {
                draggedItem = e.target.closest('.book-card');
                initialRect = draggedItem.getBoundingClientRect();
                
                // 1. Create a blank space that exactly matches the card
                placeholder = document.createElement('div');
                placeholder.className = 'book-card placeholder';
                placeholder.style.height = initialRect.height + 'px';
                
                // 2. Insert blank space exactly where card is
                container.insertBefore(placeholder, draggedItem);
                
                // 3. Make dragged item float absolutely above the exact spot
                draggedItem.style.position = 'fixed';
                draggedItem.style.top = initialRect.top + 'px';
                draggedItem.style.left = initialRect.left + 'px';
                draggedItem.style.width = initialRect.width + 'px';
                draggedItem.style.height = initialRect.height + 'px';
                draggedItem.style.margin = '0';
                draggedItem.classList.add('dragging');
                
                startY = e.touches[0].clientY;
            }
        }, {passive: false});

        container.addEventListener('touchmove', (e) => {
            if (!draggedItem) return;
            e.preventDefault(); // This strictly prevents scrolling/black bars while dragging
            
            const touchY = e.touches[0].clientY;
            const deltaY = touchY - startY;
            draggedItem.style.transform = `translateY(${deltaY}px)`;
            
            // Calculate where we are hovering
            const cards = Array.from(container.querySelectorAll('.book-card:not(.dragging):not(.placeholder)'));
            let nextSibling = null;
            
            for (let card of cards) {
                const box = card.getBoundingClientRect();
                const boxCenter = box.top + box.height / 2;
                if (touchY < boxCenter) {
                    nextSibling = card;
                    break;
                }
            }

            // If the placeholder needs to jump to a new position, animate the jump!
            if (placeholder.nextSibling !== nextSibling) {
                // Read current positions
                const staticCards = Array.from(container.querySelectorAll('.book-card:not(.dragging)'));
                const rects = new Map();
                staticCards.forEach(c => rects.set(c, c.getBoundingClientRect()));
                
                // Move placeholder
                if (nextSibling) {
                    container.insertBefore(placeholder, nextSibling);
                } else {
                    container.appendChild(placeholder);
                }
                
                // FLIP: Play animation for smooth shuffle
                staticCards.forEach(c => {
                    const oldRect = rects.get(c);
                    const newRect = c.getBoundingClientRect();
                    const moveY = oldRect.top - newRect.top;
                    
                    if (moveY !== 0) {
                        c.style.transition = 'none';
                        c.style.transform = `translateY(${moveY}px)`;
                        
                        // Force browser reflow to register the start position
                        c.offsetHeight; 
                        
                        c.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
                        c.style.transform = 'translateY(0)';
                    }
                });
            }
        }, {passive: false});

        container.addEventListener('touchend', (e) => {
            if (!draggedItem) return;
            
            // Revert DOM back to normal flow
            container.insertBefore(draggedItem, placeholder);
            placeholder.remove();
            placeholder = null;
            
            // Clear inline drag styles
            draggedItem.style.position = '';
            draggedItem.style.top = '';
            draggedItem.style.left = '';
            draggedItem.style.width = '';
            draggedItem.style.height = '';
            draggedItem.style.margin = '';
            draggedItem.style.transform = '';
            draggedItem.classList.remove('dragging');
            draggedItem = null;
            
            // Save newly customized order
            const currentCards = Array.from(container.querySelectorAll('.book-card:not(.placeholder)'));
            const newOrder = currentCards.map(card => parseInt(card.dataset.id));
            localStorage.setItem('wowBooksOrder', JSON.stringify(newOrder));
            
            books.sort((a, b) => {
                let indexA = newOrder.indexOf(a.id);
                let indexB = newOrder.indexOf(b.id);
                if(indexA === -1) indexA = 999;
                if(indexB === -1) indexB = 999;
                return indexA - indexB;
            });
        });

        searchInput.addEventListener('input', renderBooks);
        renderBooks();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered!'))
                    .catch((err) => console.log('Service Worker registration failed:'));
            });
        }
    </script>
</body>
</html>
