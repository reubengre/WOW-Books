<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Lore Reading Library</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #1a1c23;
            --text-main: #e4d8c5;
            --text-muted: #8e8c89;
            --gold-accent: #c69b6d;
            --gold-hover: #e3bc89;
            --read-bg: #122119;
            --read-border: #2e6642;
            --danger: #8a2525;
            --danger-hover: #ba3232;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--gold-accent);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--gold-accent);
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--gold-accent);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .btn-reset {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .book-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .book-card.read {
            background-color: var(--read-bg);
            border-color: var(--read-border);
            opacity: 0.85;
        }

        /* Pure CSS Cover replacing the external images */
        .book-cover {
            width: 90px;
            flex-shrink: 0;
            background-color: #2a2d36;
            border-right: 1px solid #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--gold-accent);
        }

        .book-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .category-tag {
            font-size: 0.75rem;
            color: var(--gold-accent);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .book-rating {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .star { color: var(--gold-accent); }

        .book-synopsis {
            font-size: 0.85rem;
            color: #b5b5b5;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .book-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-read { background-color: var(--gold-accent); color: #000; }
        .book-card.read .btn-read { background-color: var(--read-border); color: white; }
        .btn-hide { background-color: var(--danger); color: white; }
        
        .error-box {
            background: rgba(138, 37, 37, 0.2);
            border: 1px solid var(--danger);
            color: #ff9999;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>WoW Reading Tracker</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search by title or category...">
            <button class="btn-reset" onclick="resetHidden()">Show Hidden Books</button>
        </div>
    </header>

    <main class="book-list" id="bookContainer">
        <!-- JS will render here -->
    </main>

    <script>
        const container = document.getElementById('bookContainer');
        
        // CATCH-ALL ERROR LOGGER: Will print errors directly to the screen
        window.onerror = function(message, source, lineno, colno, error) {
            container.innerHTML += `<div class="error-box"><b>Browser Block/Crash Detected:</b> ${message} (Line ${lineno})</div>`;
            return true;
        };

        try {
            const books = [
                { id: 1, title: "Rise of the Horde", category: "The Foundations", rating: "4.21", synopsis: "Before the Dark Portal opened, the Orcs were a shamanic society on Draenor. This novel details their tragic fall into bloodlust and demonic corruption orchestrated by the Burning Legion." },
                { id: 2, title: "The Last Guardian", category: "The Foundations", rating: "4.12", synopsis: "The wizard Medivh struggles against a dark presence within himself. His apprentice, Khadgar, must uncover his master's secrets as the Orcish Horde first pours into Azeroth." },
                { id: 3, title: "Tides of Darkness", category: "The Foundations", rating: "4.15", synopsis: "Following the fall of Stormwind, the survivors flee to Lordaeron to forge a grand Alliance, desperately fighting to halt the Orcish Horde's relentless march across the continent." },
                { id: 4, title: "The Well of Eternity", category: "Time Travel & Third War", rating: "4.20", synopsis: "Modern heroes are cast 10,000 years into the past, arriving at the height of the Night Elf empire just as the Burning Legion begins its catastrophic first invasion of Azeroth." },
                { id: 5, title: "Lord of the Clans", category: "Time Travel & Third War", rating: "4.26", synopsis: "Raised as a gladiator slave by a human master, the young orc Thrall escapes to discover his heritage, master shamanism, and unite the scattered orc clans into a new Horde." },
                { id: 6, title: "Arthas: Rise of the Lich King", category: "Time Travel & Third War", rating: "4.35", synopsis: "Prince Arthas Menethil makes terrible sacrifices in an attempt to save his people from the undead plague, a tragic path that ultimately leads him to the Frozen Throne." },
                { id: 7, title: "The Shattering: Prelude to Cataclysm", category: "The MMO Era", rating: "4.05", synopsis: "Azeroth is rocked by elemental unrest. As Thrall steps down as Warchief to heal the world, Garrosh Hellscream takes command, heightening tensions between the Horde and Alliance." },
                { id: 8, title: "Sylvanas", category: "The MMO Era", rating: "4.32", synopsis: "An intimate look into the long, complex life and afterlife of the Banshee Queen, revealing the true motivations behind her most controversial actions leading into the Shadowlands." }
            ];

            let readStatus = {};
            let hiddenStatus = {};
            let storageWorking = false;

            // Safely attempt to load storage
            try {
                if (typeof localStorage !== 'undefined') {
                    const savedRead = localStorage.getItem('wowBooksRead');
                    const savedHidden = localStorage.getItem('wowBooksHidden');
                    if (savedRead) readStatus = JSON.parse(savedRead);
                    if (savedHidden) hiddenStatus = JSON.parse(savedHidden);
                    storageWorking = true;
                }
            } catch (e) {
                container.innerHTML += `<div class="error-box"><b>Notice:</b> Your browser privacy settings are blocking storage. Progress won't be saved after closing the tab.</div>`;
            }

            // Safely attempt to save storage
            function saveState() {
                if (!storageWorking) return;
                try {
                    localStorage.setItem('wowBooksRead', JSON.stringify(readStatus));
                    localStorage.setItem('wowBooksHidden', JSON.stringify(hiddenStatus));
                } catch (e) {
                    console.warn("Storage write blocked.");
                }
            }

            const searchInput = document.getElementById('searchInput');

            function renderBooks() {
                container.innerHTML = ''; 
                const searchTerm = searchInput.value.toLowerCase();

                books.forEach(book => {
                    if (hiddenStatus[book.id]) return;

                    if (book.title.toLowerCase().includes(searchTerm) || 
                        book.category.toLowerCase().includes(searchTerm)) {
                        
                        const isRead = readStatus[book.id] ? true : false;
                        
                        const card = document.createElement('div');
                        card.className = `book-card ${isRead ? 'read' : ''}`;
                        
                        // Using pure CSS covers instead of external images to prevent loading blocks
                        card.innerHTML = `
                            <div class="book-cover">${book.title}</div>
                            <div class="book-info">
                                <div class="category-tag">${book.category}</div>
                                <div class="book-title">${book.title}</div>
                                <div class="book-rating">
                                    <span class="star">★</span> ${book.rating} / 5.00
                                </div>
                                <div class="book-synopsis">${book.synopsis}</div>
                                <div class="book-actions">
                                    <button class="btn-read" onclick="toggleRead(${book.id})">
                                        ${isRead ? '✓ Read' : 'Mark as Read'}
                                    </button>
                                    <button class="btn-hide" onclick="hideBook(${book.id})">Hide</button>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                });
            }

            // Global functions so the HTML buttons can call them
            window.toggleRead = function(id) {
                readStatus[id] = !readStatus[id];
                saveState();
                renderBooks();
            };

            window.hideBook = function(id) {
                hiddenStatus[id] = true;
                saveState();
                renderBooks();
            };

            window.resetHidden = function() {
                hiddenStatus = {};
                saveState();
                renderBooks();
            };

            searchInput.addEventListener('input', renderBooks);
            
            // Initial render
            renderBooks();

        } catch (fatalError) {
            container.innerHTML += `<div class="error-box"><b>Fatal Script Error:</b> ${fatalError.message}</div>`;
        }
    </script>
</body>
</html>
