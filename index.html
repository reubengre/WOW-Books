<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WoW Library</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c69b6d">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161c;
            --text-main: #e4d8c5;
            --text-muted: #a3a19e;
            --gold-accent: #f8b700;
            --gold-muted: #c69b6d;
            --gold-border: #4a3a25;
            --read-border: #2ecc71;
            --ui-font: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overscroll-behavior-y: none;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #1a1c23 0%, #0b0c10 100%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 16px;
            line-height: 1.5;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--gold-border);
            padding-bottom: 16px;
            background: linear-gradient(90deg, transparent, rgba(198, 155, 109, 0.1), transparent);
        }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--gold-muted);
            box-shadow: 0 0 10px rgba(198, 155, 109, 0.3);
        }

        h1 {
            color: var(--gold-accent);
            font-family: var(--ui-font);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: rgba(21, 22, 28, 0.8);
            border: 1px solid var(--gold-border);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--gold-muted);
        }

        .btn-secondary {
            flex: 1;
            background: linear-gradient(to bottom, #2a2c35, #1a1c23);
            border: 1px solid var(--gold-border);
            color: var(--gold-muted);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--ui-font);
            text-transform: uppercase;
            font-weight: bold;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
            position: relative;
            flex-grow: 1;
        }

        @media (min-width: 768px) {
            .book-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
                gap: 20px;
            }
        }

        .book-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--gold-border);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .book-card.ghost {
            position: fixed;
            z-index: 9999;
            opacity: 0.95;
            box-shadow: 0 25px 35px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        .book-card.placeholder {
            opacity: 0 !important; 
        }

        .book-card.read {
            border: 2px solid var(--read-border);
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.3);
        }

        .read-stamp {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: #2ecc71;
            color: #0b0c10;
            font-family: var(--ui-font);
            font-weight: bold;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .book-card.read .read-stamp {
            display: block;
        }

        .bg-blur {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.25);
            z-index: 0;
            pointer-events: none;
        }

        .book-card.read .bg-blur {
            filter: blur(25px) brightness(0.2) saturate(1.2);
        }

        .book-cover, .book-info {
            position: relative;
            z-index: 1;
        }

        .book-cover {
            flex-shrink: 0;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* MINIMIZED STATE */
        .book-card.minimized .book-cover {
            width: 130px;
            height: 195px;
        }
        .book-card.minimized .book-synopsis,
        .book-card.minimized .book-preview-section,
        .book-card.minimized .book-actions,
        .book-card.minimized .book-rating,
        .book-card.minimized .book-metadata {
            display: none;
        }
        .book-card.minimized .book-title {
            font-size: 1.55rem;
            line-height: 1.1;
            margin-top: 8px;
        }

        /* UNMINIMIZED STATE */
        .book-card:not(.minimized) {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            z-index: 9999;
            flex-direction: column;
            border-radius: 0;
            margin: 0;
            overflow-y: auto;
            border: none;
            background-color: #0b0c10;
        }
        .book-card:not(.minimized) .bg-blur {
            position: fixed; 
            filter: blur(40px) brightness(0.2);
        }
        .book-card:not(.minimized) .book-cover {
            width: 100%;
            height: 45vh;
            border-right: none;
            border-bottom: 2px solid var(--gold-border);
            flex-shrink: 0;
        }
        .book-card:not(.minimized) .book-cover img {
            object-fit: contain; 
            padding: 16px;
            background: rgba(0,0,0,0.6);
        }
        .book-card:not(.minimized) .drag-handle {
            display: none;
        }
        .book-card:not(.minimized) .card-indicator {
            font-size: 2rem; 
            color: #fff;
        }
        .book-card:not(.minimized) .book-title {
            font-size: 1.8rem;
            line-height: 1.2;
            margin-bottom: 12px;
        }
        .book-card:not(.minimized) .book-actions {
            margin-top: 24px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            flex-wrap: wrap;
        }

        .book-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 4px;
        }

        .drag-handle {
            color: var(--gold-muted);
            font-size: 1.5rem;
            cursor: grab;
            user-select: none;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            touch-action: none;
        }

        .header-text { flex-grow: 1; }

        .category-tag {
            font-size: 0.75rem;
            color: var(--gold-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .card-indicator {
            font-size: 1.5rem;
            color: var(--gold-muted);
            flex-shrink: 0;
            text-align: right;
            line-height: 1;
            font-weight: 300;
        }

        .book-title {
            font-family: var(--ui-font);
            font-weight: bold;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        .book-metadata {
            font-size: 0.9rem;
            color: #bbb;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 16px;
        }
        .book-metadata span {
            color: #fff;
            font-weight: bold;
        }

        .book-rating {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .star { color: var(--gold-accent); }

        .book-synopsis {
            font-size: 1rem;
            color: #d1d1d1;
            margin-bottom: 16px;
            line-height: 1.6;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* --- PREVIEW DROPDOWN STYLES --- */
        .book-preview-section {
            margin-bottom: 16px;
            border-top: 1px solid rgba(198, 155, 109, 0.2);
            border-bottom: 1px solid rgba(198, 155, 109, 0.2);
            padding: 12px 0;
        }

        .book-preview-section summary {
            color: var(--gold-accent);
            font-family: var(--ui-font);
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
            list-style: none; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-preview-section summary::-webkit-details-marker {
            display: none;
        }

        .book-preview-section summary::after {
            content: '▼';
            font-size: 0.75rem;
            transition: transform 0.2s ease;
        }

        .book-preview-section[open] summary::after {
            transform: rotate(180deg);
        }

        .preview-text {
            margin-top: 16px;
            color: #b3b6bd;
            font-size: 0.95rem;
            line-height: 1.7;
            background: rgba(0, 0, 0, 0.4);
            padding: 16px;
            border-left: 3px solid var(--gold-muted);
            border-radius: 0 4px 4px 0;
            white-space: pre-wrap;
        }

        .book-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        button.action-btn, a.action-btn {
            flex: 1;
            padding: 14px;
            border: 1px solid transparent;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            font-family: var(--ui-font);
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-read { 
            background: linear-gradient(to bottom, #d4a976, #b0814a); 
            color: #2a1f12; 
            border-color: #f8b700;
        }
        .book-card.read .btn-read { 
            background: linear-gradient(to bottom, #2ecc71, #27ae60); 
            color: #ffffff; 
            border-color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        .btn-buy {
            background: linear-gradient(to bottom, #2980b9, #1f618d);
            color: #ffffff;
            border-color: #3498db;
        }

        .btn-hide { 
            background: linear-gradient(to bottom, #8a2525, #5c1616); 
            color: #f0caca;
            border-color: #a33535;
        }

        footer.app-footer {
            text-align: center;
            padding: 24px 0 12px 0;
            margin-top: auto;
            border-top: 1px solid rgba(198, 155, 109, 0.15);
        }

        .bmc-link {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--ui-font);
            transition: color 0.2s ease;
        }

        .bmc-link:hover {
            color: var(--gold-accent);
        }

    </style>
</head>
<body>

    <header>
        <img src="Images/icon.svg" alt="WoW Library Logo" class="header-logo" onerror="this.style.display='none'">
        <h1>WoW Library</h1>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by title or category...">
        <div class="button-group">
            <button class="btn-secondary" onclick="toggleAllMinimize()">Toggle Minimize</button>
            <button class="btn-secondary" onclick="resetHidden()">Show Hidden</button>
        </div>
    </div>

    <main class="book-list" id="bookContainer"></main>

    <footer class="app-footer">
        <a href="https://buymeacoffee.com/reubengr" target="_blank" class="bmc-link">☕ Support this project</a>
    </footer>

    <script>
        const colorSilver = "#c0c5ce";
        const colorGold = "#f0c265";
        const colorIce = "#84cce3";
        const colorFel = "#73e041";
        const colorFire = "#d65a31";
        const tag = "reubengr-20";

        let books = [
            { id: 1, title: "Rise of the Horde", titleColor: colorSilver, category: "The Foundations", author: "Christie Golden", date: "Dec 2006", rating: "4.21", 
              synopsis: "Before the Dark Portal opened, the Orcs were a noble, shamanic society living in harmony on Draenor. This novel details their tragic, systematic fall into bloodlust, manipulated by the Burning Legion's deception of the orc elder Ner'zhul and the relentless ambition of Gul'dan.", 
              preview: "The drumming was constant, a heartbeat of the world that echoed through the Nagrand plains. Durotan, chieftain of the Frostwolves, watched the flames of the Great Anvil leap into the night sky. There was a new tension in the air, a whisper of dark spirits that the shaman could not silence. Gul'dan stood at the edge of the firelight, his eyes gleaming with a twisted, unnatural fel-green promise that made Durotan's blood run cold.",
              cover: "Images/rise-of-the-horde.jpg", buyUrl: `https://www.amazon.com/s?k=Rise+of+the+Horde+Christie+Golden&tag=${tag}` },
              
            { id: 2, title: "The Last Guardian", titleColor: colorSilver, category: "The Foundations", author: "Jeff Grubb", date: "Dec 2001", rating: "4.12", 
              synopsis: "The wizard Medivh struggles against a dark, ancient presence residing within his own soul. His young apprentice, Khadgar, is sent by the Kirin Tor to uncover his master's secrets just as the Orcish Horde begins pouring into Azeroth through the Dark Portal.", 
              preview: "Karazhan loomed like a jagged spear piercing the storm clouds above Deadwind Pass. Khadgar tightened his cloak against the biting wind, his satchel of missives feeling heavier with each step up the winding stone path. He had been warned that the Magus Medivh was eccentric, perhaps even mad. But as the heavy oak doors groaned open without a touch, revealing a profound, unnatural darkness within, Khadgar realized the Kirin Tor had not told him the entire truth.",
              cover: "Images/the-last-guardian.jpg", buyUrl: `https://www.amazon.com/s?k=The+Last+Guardian+Jeff+Grubb&tag=${tag}` },
              
            { id: 3, title: "Tides of Darkness", titleColor: colorGold, category: "The Foundations", author: "Aaron Rosenberg", date: "Aug 2007", rating: "4.15", 
              synopsis: "Following the devastating fall of Stormwind, Lord Anduin Lothar leads the human survivors north across the Great Sea to Lordaeron. There, he must convince the human kingdoms, dwarves, and high elves to forge a grand Alliance to halt the Orcish Horde's brutal march across the continent.", 
              preview: "The sails of the refugee fleet snapped violently in the northern gale. Lord Anduin Lothar gripped the railing of the flagship, watching the smoke of his homeland fade into the horizon. Stormwind was gone. King Llane was dead. Below decks, the remnants of his people wept in the darkness. Lothar turned his gaze toward the shores of Lordaeron, knowing that the survival of humanity now depended on kings who had never seen the monstrous green tide of the Horde.",
              cover: "Images/tides-of-darkness.jpg", buyUrl: `https://www.amazon.com/s?k=Tides+of+Darkness+Aaron+Rosenberg&tag=${tag}` },
              
            { id: 4, title: "Beyond the Dark Portal", titleColor: colorGold, category: "The Foundations", author: "Aaron Rosenberg & Christie Golden", date: "Apr 2008", rating: "4.13", 
              synopsis: "The Alliance has shattered the Horde, but the threat is not over. The elder shaman Ner'zhul has taken command of the remaining orc clans on Draenor and opened a rift to Azeroth once again. The Alliance expedition must push through the Dark Portal into the dying alien world to end the threat forever.", 
              preview: "The portal flared with a sickening, chaotic light, casting long shadows across the Blasted Lands. General Turalyon raised his shattered sword, the holy light responding to his call despite the suffocating dread radiating from the rift. 'We do not know what awaits us on the other side,' Turalyon shouted, his voice echoing over the assembled Sons of Lothar. 'But we step into the abyss so that Azeroth may never have to fear it again.'",
              cover: "Images/beyond-the-dark-portal.jpg", buyUrl: `https://www.amazon.com/s?k=Beyond+the+Dark+Portal+Aaron+Rosenberg&tag=${tag}` },
              
            { id: 5, title: "Day of the Dragon", titleColor: colorGold, category: "The Foundations", author: "Richard A. Knaak", date: "Feb 2001", rating: "4.05", 
              synopsis: "Set in the aftermath of the Second War, the renegade mage Rhonin is dispatched on a perilous mission to the orc-controlled fortress of Grim Batol. He must uncover a dark conspiracy and orchestrate the liberation of the Dragonqueen Alexstrasza, who is being held captive by the Dragonmaw Clan.", 
              preview: "Grim Batol was a fortress of nightmares, its ancient dwarven halls corrupted by the stench of sulfur and the cruel laughter of the Dragonmaw clan. Rhonin crouched behind an outcropping of jagged obsidian, his hands weaving an invisible ward of silence. In the cavern below, the great red leviathan, Alexstrasza the Life-Binder, thrashed against her enchanted chains. The Demon Soul glowed in the hands of the orc warlock Nekros, an artifact of such immense power that even the air around it seemed to bleed.",
              cover: "Images/day-of-the-dragon.jpg", buyUrl: `https://www.amazon.com/s?k=Day+of+the+Dragon+Richard+Knaak&tag=${tag}` },
              
            { id: 6, title: "The Well of Eternity", titleColor: colorSilver, category: "Time Travel & 3rd War", author: "Richard A. Knaak", date: "Mar 2004", rating: "4.20", 
              synopsis: "A temporal anomaly casts modern heroes—the dragon mage Krasus, the human wizard Rhonin, and the orc veteran Broxigar—ten thousand years into Azeroth's past. They arrive during the zenith of the night elven empire, just as Queen Azshara and her Highborne inadvertently invite the Burning Legion into the world.", 
              preview: "The Well of Eternity was a churning maelstrom of raw, unfiltered arcane magic. Its crystalline waters pulsed with a chaotic brilliance that mesmerized anyone who stared into its depths for too long. Deep within the palace, Queen Azshara traced the rim of her golden goblet, listening to the whispered promises of a god-like entity reaching out from the Great Dark Beyond. Sargeras had found them, and the Queen believed he was coming to offer them perfection.",
              cover: "Images/the-well-of-eternity.jpg", buyUrl: `https://www.amazon.com/s?k=The+Well+of+Eternity+Richard+Knaak&tag=${tag}` },
              
            { id: 7, title: "The Demon Soul", titleColor: colorFire, category: "Time Travel & 3rd War", author: "Richard A. Knaak", date: "Oct 2004", rating: "4.22", 
              synopsis: "As the Burning Legion lays waste to ancient Kalimdor, the Dragon Aspects construct a powerful artifact to turn the tide. However, the black dragon Neltharion succumbs to the Old Gods' whispers, betraying his brethren. The defenders of Azeroth are caught between an endless demonic army and a newly forged madness.", 
              preview: "Neltharion spread his massive, obsidian wings, casting a shadow over the assembled Dragonflights. The golden disc hovering before him—the Dragon Soul—hummed with the combined essence of the other Aspects. It was meant to be their ultimate weapon against the Legion. But as Neltharion channeled his power into the artifact, the whispers of the earth grew to a deafening roar in his mind. The disc shattered the harmony of the flights, and in that moment, the Earth-Warder ceased to be. Deathwing was born.",
              cover: "Images/the-demon-soul.jpg", buyUrl: `https://www.amazon.com/s?k=The+Demon+Soul+Richard+Knaak&tag=${tag}` },
              
            { id: 8, title: "The Sundering", titleColor: colorSilver, category: "Time Travel & 3rd War", author: "Richard A. Knaak", date: "Jul 2005", rating: "4.26", 
              synopsis: "The apocalyptic conclusion to the War of the Ancients. Malfurion Stormrage, Tyrande Whisperwind, and their unlikely allies mount a final, desperate assault on the Well of Eternity. The ensuing catastrophe will shatter the singular continent of Kalimdor and shape the world of Azeroth forever.", 
              preview: "The earth groaned as the portal above the Well of Eternity began to collapse. The magical vortex tore at the foundations of the world, pulling stones, trees, and demons into its chaotic maw. Malfurion held onto the roots of the world tree, his druidic magic struggling to stitch the torn leylines back together. But the pressure was too immense. With a deafening crack that ruptured the sky, the Well imploded, and the sea rushed in to claim the heart of the empire.",
              cover: "Images/the-sundering.jpg", buyUrl: `https://www.amazon.com/s?k=The+Sundering+Richard+Knaak&tag=${tag}` },
              
            { id: 9, title: "Lord of the Clans", titleColor: colorGold, category: "Time Travel & 3rd War", author: "Christie Golden", date: "Oct 2001", rating: "4.26", 
              synopsis: "Raised as a gladiator slave by a cruel human master, the young orc Thrall knows nothing of his people's proud history. Breaking free of his chains, he journeys across Lordaeron to master the ancient ways of shamanism, reclaim his heritage, and unite the scattered, lethargic orc clans into a new Horde.", 
              preview: "Thrall stood in the center of the muddy arena, the roar of the human spectators washing over him. Aedelas Blackmoore watched from the balcony, a cruel smile playing on his lips. Thrall was a beast to them, a weapon forged for their entertainment. But as he looked down at the blood on his hands, a latent memory stirred within him—a connection to the earth, the wind, and the fire. He was not a slave. He was the son of Durotan.",
              cover: "Images/lord-of-the-clans.jpg", buyUrl: `https://www.amazon.com/s?k=Lord+of+the+Clans+Christie+Golden&tag=${tag}` },
              
            { id: 10, title: "Of Blood and Honor", titleColor: colorSilver, category: "Time Travel & 3rd War", author: "Chris Metzen", date: "Jan 2001", rating: "4.03", 
              synopsis: "The revered paladin Tirion Fordring believes all orcs are irredeemable monsters until he is saved by an old, honorable orc warrior named Eitrigg. When his own people capture Eitrigg, Tirion must choose between his strict allegiance to the Alliance and the universal demands of honor and justice.", 
              preview: "Tirion Fordring stared at the ruined tower, his silver warhammer resting heavy in his grip. The orc before him was old, his skin graying and scarred from countless battles. By all accounts, Tirion should have struck him down in the name of the Light. But the creature had lowered its weapon and offered a hand of mercy. In that fleeting exchange of gazes, Tirion saw a profound wisdom and a shattered pride that challenged everything he had ever been taught about the Horde.",
              cover: "Images/of-blood-and-honor.jpg", buyUrl: `https://www.amazon.com/s?k=Of+Blood+and+Honor+Chris+Metzen&tag=${tag}` },
              
            { id: 11, title: "Arthas: Rise of the Lich King", titleColor: colorIce, category: "Time Travel & 3rd War", author: "Christie Golden", date: "Apr 2009", rating: "4.35", 
              synopsis: "The definitive tragedy of Prince Arthas Menethil. Driven by a desperate need to save his people from the undead plague, the golden prince of Lordaeron makes a series of terrible sacrifices. His righteous crusade leads him to the frozen wastes of Northrend, where the cursed runeblade Frostmourne awaits.", 
              preview: "The wind howled across the icy expanse of Icecrown, carrying whispers of power and doom. Arthas stood before the frozen dais, the cursed runeblade Frostmourne hovering within the glacial block. He ignored the warnings of Muradin, ignored the chilling sensation creeping up his arm. 'I will gladly bear any curse to save my homeland,' Arthas declared. As he grasped the hilt, the ice shattered, and the Light forever abandoned the prince of Lordaeron.",

        let readStatus = JSON.parse(localStorage.getItem('wowBooksRead')) || {};
        let hiddenStatus = JSON.parse(localStorage.getItem('wowBooksHidden')) || {};
        let minStatus = JSON.parse(localStorage.getItem('wowBooksMin')) || {};
        let customOrder = JSON.parse(localStorage.getItem('wowBooksOrder')) || [];

        if (customOrder.length > 0) {
            books.sort((a, b) => {
                let indexA = customOrder.indexOf(a.id);
                let indexB = customOrder.indexOf(b.id);
                if (indexA === -1) indexA = 999; 
                if (indexB === -1) indexB = 999;
                return indexA - indexB;
            });
        }

        books.forEach(book => {
            if (minStatus[book.id] === undefined) {
                minStatus[book.id] = true;
            }
        });

        let allMinimized = true;
        const container = document.getElementById('bookContainer');
        const searchInput = document.getElementById('searchInput');

        function saveState() {
            localStorage.setItem('wowBooksRead', JSON.stringify(readStatus));
            localStorage.setItem('wowBooksHidden', JSON.stringify(hiddenStatus));
            localStorage.setItem('wowBooksMin', JSON.stringify(minStatus));
        }

        function renderBooks() {
            container.innerHTML = ''; 
            const searchTerm = searchInput.value.toLowerCase();

            books.forEach(book => {
                if (hiddenStatus[book.id]) return;

                if (book.title.toLowerCase().includes(searchTerm) || 
                    book.category.toLowerCase().includes(searchTerm)) {
                    
                    const isRead = readStatus[book.id];
                    const isMin = minStatus[book.id];
                    
                    const card = document.createElement('div');
                    card.className = `book-card ${isRead ? 'read' : ''} ${isMin ? 'minimized' : ''}`;
                    card.dataset.id = book.id;
                    card.onclick = (e) => handleCardClick(e, book.id);
                    
                    card.innerHTML = `
                        <div class="read-stamp">Read</div>
                        <div class="bg-blur" style="background-image: url('${book.cover}')"></div>
                        <div class="book-cover">
                            <img src="${book.cover}" alt="${book.title} Cover" onerror="this.onerror=null; this.src='https://placehold.co/130x195/15161c/c69b6d?text=No+Cover';">
                        </div>
                        <div class="book-info">
                            <div class="card-header">
                                <div class="drag-handle" onclick="event.stopPropagation()">☰</div>
                                <div class="header-text">
                                    <div class="category-tag">${book.category}</div>
                                    <div class="book-title" style="color: ${book.titleColor}">${book.title}</div>
                                </div>
                                <div class="card-indicator">${isMin ? '+' : '✕'}</div>
                            </div>
                            <div class="book-metadata">
                                <div>Author: <br><span>${book.author}</span></div>
                                <div>Published: <br><span>${book.date}</span></div>
                            </div>
                            <div class="book-rating">
                                <span class="star">★</span> ${book.rating} / 5.00
                            </div>
                            
                            <div class="book-synopsis">${book.synopsis}</div>
                            
                            <details class="book-preview-section" onclick="event.stopPropagation()">
                                <summary>Read Preview Excerpt</summary>
                                <div class="preview-text">${book.preview}</div>
                            </details>

                            <div class="book-actions">
                                <button class="action-btn btn-read" onclick="event.stopPropagation(); toggleRead(${book.id})">
                                    ${isRead ? '✓ Read' : 'Mark as Read'}
                                </button>
                                <a href="${book.buyUrl}" target="_blank" class="action-btn btn-buy" onclick="event.stopPropagation()">Buy Book</a>
                                <button class="action-btn btn-hide" onclick="event.stopPropagation(); hideBook(${book.id})">Hide</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
            saveState(); 
        }

        window.handleCardClick = function(event, id) {
            if (event.target.tagName === 'BUTTON' || 
                event.target.tagName === 'A' || 
                event.target.closest('button') || 
                event.target.closest('a') || 
                event.target.classList.contains('drag-handle') ||
                event.target.closest('details')) {
                return;
            }
            toggleMin(id);
        };

        window.toggleRead = function(id) {
            readStatus[id] = !readStatus[id];
            saveState();
            renderBooks();
        };

        window.hideBook = function(id) {
            hiddenStatus[id] = true;
            saveState();
            renderBooks();
        };

        window.toggleMin = function(id) {
            minStatus[id] = !minStatus[id];
            saveState();
            renderBooks();
            
            if (!minStatus[id]) {
                setTimeout(() => {
                    const expandedCard = document.querySelector(`.book-card[data-id="${id}"]`);
                    if (expandedCard) expandedCard.scrollTop = 0;
                }, 10);
            }
        };

        window.toggleAllMinimize = function() {
            allMinimized = !allMinimized;
            books.forEach(book => { minStatus[book.id] = allMinimized; });
            saveState();
            renderBooks();
        };

        window.resetHidden = function() {
            hiddenStatus = {};
            saveState();
            renderBooks();
        };

        let draggedItem = null;
        let ghostItem = null;
        let startY = 0;
        let touchOffsetY = 0;

        container.addEventListener('touchstart', (e) => {
            const handle = e.target.closest('.drag-handle');
            if (!handle) return;
            
            draggedItem = handle.closest('.book-card');
            const rect = draggedItem.getBoundingClientRect();
            
            ghostItem = draggedItem.cloneNode(true);
            ghostItem.classList.add('ghost');
            ghostItem.style.top = rect.top + 'px';
            ghostItem.style.left = rect.left + 'px';
            ghostItem.style.width = rect.width + 'px';
            document.body.appendChild(ghostItem);

            draggedItem.classList.add('placeholder');
            
            startY = e.touches[0].clientY;
            touchOffsetY = startY - rect.top;
            
            document.body.style.overflow = 'hidden';
        }, {passive: false});

        container.addEventListener('touchmove', (e) => {
            if (!ghostItem) return;
            e.preventDefault(); 
            
            const touchY = e.touches[0].clientY;
            ghostItem.style.top = (touchY - touchOffsetY) + 'px';
            
            ghostItem.style.display = 'none';
            const elementUnderFinger = document.elementFromPoint(e.touches[0].clientX, touchY);
            ghostItem.style.display = '';
            
            if (!elementUnderFinger) return;
            
            const targetCard = elementUnderFinger.closest('.book-card:not(.ghost)');
            
            if (targetCard && targetCard !== draggedItem) {
                const staticCards = Array.from(container.querySelectorAll('.book-card:not(.ghost)'));
                const oldRects = new Map();
                staticCards.forEach(c => oldRects.set(c, c.getBoundingClientRect()));
                
                const targetRect = targetCard.getBoundingClientRect();
                const targetCenter = targetRect.top + targetRect.height / 2;
                
                if (touchY > targetCenter) {
                    container.insertBefore(draggedItem, targetCard.nextSibling);
                } else {
                    container.insertBefore(draggedItem, targetCard);
                }
                
                staticCards.forEach(c => {
                    if (c === draggedItem) return;
                    
                    const newRect = c.getBoundingClientRect();
                    const oldRect = oldRects.get(c);
                    const moveY = oldRect.top - newRect.top;
                    
                    if (moveY !== 0) {
                        c.style.transition = 'none';
                        c.style.transform = `translateY(${moveY}px)`;
                        c.offsetHeight; 
                        c.style.transition = 'transform 0.3s ease';
                        c.style.transform = 'translateY(0)';
                    }
                });
            }
        }, {passive: false});

        container.addEventListener('touchend', (e) => {
            if (!ghostItem) return;
            
            ghostItem.remove();
            ghostItem = null;
            
            draggedItem.classList.remove('placeholder');
            draggedItem = null;
            document.body.style.overflow = '';
            
            const currentCards = Array.from(container.querySelectorAll('.book-card'));
            const newOrder = currentCards.map(card => parseInt(card.dataset.id));
            localStorage.setItem('wowBooksOrder', JSON.stringify(newOrder));
            
            books.sort((a, b) => {
                let indexA = newOrder.indexOf(a.id);
                let indexB = newOrder.indexOf(b.id);
                if(indexA === -1) indexA = 999;
                if(indexB === -1) indexB = 999;
                return indexA - indexB;
            });
        });

        searchInput.addEventListener('input', renderBooks);
        renderBooks();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
