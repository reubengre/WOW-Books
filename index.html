<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Lore Reading Library</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #1a1c23;
            --text-main: #e4d8c5;
            --text-muted: #8e8c89;
            --gold-accent: #c69b6d;
            --gold-hover: #e3bc89;
            --read-bg: #122119;
            --read-border: #2e6642;
            --danger: #8a2525;
            --danger-hover: #ba3232;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--gold-accent);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--gold-accent);
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--gold-accent);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .btn-secondary {
            flex: 1;
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .book-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .book-card.read {
            background-color: var(--read-bg);
            border-color: var(--read-border);
            opacity: 0.85;
        }

        .book-cover {
            width: 115px;
            flex-shrink: 0;
            background-color: #15171e;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #2a2d36;
        }

        .book-cover img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .book-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 4px;
        }

        .header-text {
            flex-grow: 1;
        }

        .category-tag {
            font-size: 0.75rem;
            color: var(--gold-accent);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .btn-minimize {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            padding-top: 2px;
            flex-shrink: 0;
            width: 20px;
            text-align: left;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .book-rating {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .star { color: var(--gold-accent); }

        .book-synopsis {
            font-size: 0.85rem;
            color: #b5b5b5;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .book-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        /* Minimized State */
        .book-card.minimized .book-synopsis {
            display: none;
        }
        .book-card.minimized .book-actions {
            display: none;
        }
        .book-card.minimized .book-cover {
            width: 60px;
        }
        .book-card.minimized .book-cover img {
            height: 90px;
        }

        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-read { background-color: var(--gold-accent); color: #000; }
        .book-card.read .btn-read { background-color: var(--read-border); color: white; }
        .btn-hide { background-color: var(--danger); color: white; }

    </style>
</head>
<body>

    <header>
        <h1>WoW Reading Tracker</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search by title or category...">
            <div class="button-group">
                <button class="btn-secondary" onclick="toggleAllMinimize()">Toggle Minimize</button>
                <button class="btn-secondary" onclick="resetHidden()">Show Hidden Books</button>
            </div>
        </div>
    </header>

    <main class="book-list" id="bookContainer"></main>

    <script>
        const books = [
            // The Foundations
            { id: 1, title: "Rise of the Horde", category: "The Foundations", rating: "4.21", synopsis: "Before the Dark Portal opened, the Orcs were a shamanic society on Draenor. Details their tragic fall into bloodlust orchestrated by the Burning Legion.", cover: "Images/rise-of-the-horde.jpg" },
            { id: 2, title: "The Last Guardian", category: "The Foundations", rating: "4.12", synopsis: "The wizard Medivh struggles against a dark presence. His apprentice, Khadgar, must uncover his secrets as the Horde pours into Azeroth.", cover: "Images/the-last-guardian.jpg" },
            { id: 3, title: "Tides of Darkness", category: "The Foundations", rating: "4.15", synopsis: "Following the fall of Stormwind, survivors flee to Lordaeron to forge a grand Alliance and halt the Orcish Horde's march.", cover: "Images/tides-of-darkness.jpg" },
            { id: 4, title: "Beyond the Dark Portal", category: "The Foundations", rating: "4.13", synopsis: "The Alliance expedition pushes through the portal into Draenor to stop the orcish threat at its source.", cover: "Images/beyond-the-dark-portal.jpg" },
            { id: 5, title: "Day of the Dragon", category: "The Foundations", rating: "4.05", synopsis: "Set after the Second War, focusing on the mage Rhonin and the liberation of the Dragonqueen Alexstrasza from the Dragonmaw Clan.", cover: "Images/day-of-the-dragon.jpg" },
            
            // Time Travel & Third War
            { id: 6, title: "The Well of Eternity", category: "Time Travel & 3rd War", rating: "4.20", synopsis: "Modern heroes are cast 10,000 years into the past during the Burning Legion's first invasion of Azeroth.", cover: "Images/the-well-of-eternity.jpg" },
            { id: 7, title: "The Demon Soul", category: "Time Travel & 3rd War", rating: "4.22", synopsis: "Part two of the War of the Ancients. Deathwing's betrayal is revealed as the defenders of Azeroth struggle to survive.", cover: "Images/the-demon-soul.jpg" },
            { id: 8, title: "The Sundering", category: "Time Travel & 3rd War", rating: "4.26", synopsis: "The conclusion to the War of the Ancients. The Well of Eternity collapses, reshaping the continents of Azeroth forever.", cover: "Images/the-sundering.jpg" },
            { id: 9, title: "Lord of the Clans", category: "Time Travel & 3rd War", rating: "4.26", synopsis: "Raised as a gladiator slave, the young orc Thrall escapes to master shamanism and unite the scattered orc clans into a new Horde.", cover: "Images/lord-of-the-clans.jpg" },
            { id: 10, title: "Of Blood and Honor", category: "Time Travel & 3rd War", rating: "4.03", synopsis: "The paladin Tirion Fordring risks everything when he makes a fateful connection with the honorable orc Eitrigg.", cover: "Images/of-blood-and-honor.jpg" },
            { id: 11, title: "Arthas: Rise of the Lich King", category: "Time Travel & 3rd War", rating: "4.35", synopsis: "Prince Arthas Menethil makes terrible sacrifices to save his people, a tragic path that leads him to the Frozen Throne.", cover: "Images/arthas-rise-of-the-lich-king.jpg" },
            { id: 12, title: "Illidan", category: "Time Travel & 3rd War", rating: "4.24", synopsis: "Follows Illidan Stormrage from his release in Warcraft III through his rule over Outland.", cover: "Images/illidan.jpg" },
            
            // The MMO Era
            { id: 13, title: "Cycle of Hatred", category: "The MMO Era", rating: "3.55", synopsis: "Set shortly before Vanilla WoW, exploring the fragile peace between the Horde and Alliance in Kalimdor.", cover: "Images/cycle-of-hatred.jpg" },
            { id: 14, title: "Night of the Dragon", category: "The MMO Era", rating: "3.95", synopsis: "A sequel to Day of the Dragon, returning to Grim Batol to face the sinister Twilight Dragonflight.", cover: "Images/night-of-the-dragon.jpg" },
            { id: 15, title: "Stormrage", category: "The MMO Era", rating: "3.90", synopsis: "Malfurion Stormrage is trapped in the Emerald Nightmare, and his allies must fight to awaken him before the corruption spreads.", cover: "Images/stormrage.jpg" },
            { id: 16, title: "The Shattering", category: "The MMO Era", rating: "4.05", synopsis: "As Thrall steps down to heal the world, Garrosh Hellscream takes command, heightening faction tensions.", cover: "Images/the-shattering.jpg" },
            { id: 17, title: "Wolfheart", category: "The MMO Era", rating: "3.90", synopsis: "King Varian Wrynn struggles to accept the Worgen into the Alliance while Garrosh presses his assault on Ashenvale.", cover: "Images/wolfheart.jpg" },
            { id: 18, title: "Thrall: Twilight of the Aspects", category: "The MMO Era", rating: "4.08", synopsis: "Thrall journeys across time and space to aid the Dragon Aspects in their fight against the Twilight's Hammer.", cover: "Images/thrall-twilight-of-the-aspects.jpg" },
            { id: 19, title: "Jaina Proudmoore: Tides of War", category: "The MMO Era", rating: "4.21", synopsis: "The tragic destruction of Theramore pushes Jaina Proudmoore to the brink, altering her path forever.", cover: "Images/jaina-proudmoore-tides-of-war.jpg" },
            { id: 20, title: "Dawn of the Aspects", category: "The MMO Era", rating: "4.07", synopsis: "Kalecgos experiences visions of the ancient proto-dragons and their original battle against Galakrond.", cover: "Images/dawn-of-the-aspects.jpg" },
            { id: 21, title: "Vol'jin: Shadows of the Horde", category: "The MMO Era", rating: "4.22", synopsis: "Recovering from an assassination attempt in Pandaria, Vol'jin must defend a monastery against the Zandalari.", cover: "Images/voljin-shadows-of-the-horde.jpg" },
            { id: 22, title: "War Crimes", category: "The MMO Era", rating: "4.15", synopsis: "Garrosh Hellscream stands trial in Pandaria, forcing leaders from both factions to confront their own pasts.", cover: "Images/war-crimes.jpg" },
            { id: 23, title: "Before the Storm", category: "The MMO Era", rating: "3.95", synopsis: "Anduin Wrynn and Sylvanas Windrunner attempt to navigate a tenuous peace after the defeat of the Burning Legion.", cover: "Images/before-the-storm.jpg" },
            { id: 24, title: "Shadows Rising", category: "The MMO Era", rating: "3.85", synopsis: "The Horde and Alliance hunt for Sylvanas and Nathanos in the aftermath of the Fourth War.", cover: "Images/shadows-rising.jpg" },
            { id: 25, title: "Sylvanas", category: "The MMO Era", rating: "4.32", synopsis: "An intimate look into the long afterlife of the Banshee Queen and her motivations leading into the Shadowlands.", cover: "Images/sylvanas.jpg" },
            { id: 26, title: "War of the Scaleborn", category: "The MMO Era", rating: "4.10", synopsis: "An ancient history of the conflict between the empowered Dragon Aspects and the elemental Primalists.", cover: "Images/war-of-the-scaleborn.jpg" },
            { id: 27, title: "Blood Ties", category: "The MMO Era", rating: "TBD", synopsis: "Sets the stage for the Midnight expansion as the void forces prepare to strike at the heart of Azeroth.", cover: "Images/blood-ties.jpg" }
        ];

        let readStatus = JSON.parse(localStorage.getItem('wowBooksRead')) || {};
        let hiddenStatus = JSON.parse(localStorage.getItem('wowBooksHidden')) || {};
        let minStatus = JSON.parse(localStorage.getItem('wowBooksMin')) || {};
        let allMinimized = false;

        const container = document.getElementById('bookContainer');
        const searchInput = document.getElementById('searchInput');

        function saveState() {
            localStorage.setItem('wowBooksRead', JSON.stringify(readStatus));
            localStorage.setItem('wowBooksHidden', JSON.stringify(hiddenStatus));
            localStorage.setItem('wowBooksMin', JSON.stringify(minStatus));
        }

        function renderBooks() {
            container.innerHTML = ''; 
            const searchTerm = searchInput.value.toLowerCase();

            books.forEach(book => {
                if (hiddenStatus[book.id]) return;

                if (book.title.toLowerCase().includes(searchTerm) || 
                    book.category.toLowerCase().includes(searchTerm)) {
                    
                    const isRead = readStatus[book.id];
                    const isMin = minStatus[book.id];
                    
                    const card = document.createElement('div');
                    card.className = `book-card ${isRead ? 'read' : ''} ${isMin ? 'minimized' : ''}`;
                    
                    card.innerHTML = `
                        <div class="book-cover">
                            <img src="${book.cover}" alt="${book.title} Cover" onerror="this.onerror=null; this.src='https://placehold.co/115x160/1a1c23/c69b6d?text=No+Cover';">
                        </div>
                        <div class="book-info">
                            <div class="card-header">
                                <button class="btn-minimize" onclick="toggleMin(${book.id})">${isMin ? '+' : '−'}</button>
                                <div class="header-text">
                                    <div class="category-tag">${book.category}</div>
                                    <div class="book-title">${book.title}</div>
                                </div>
                            </div>
                            <div class="book-rating">
                                <span class="star">★</span> ${book.rating} / 5.00
                            </div>
                            <div class="book-synopsis">${book.synopsis}</div>
                            <div class="book-actions">
                                <button class="btn-read" onclick="toggleRead(${book.id})">
                                    ${isRead ? '✓ Read' : 'Mark as Read'}
                                </button>
                                <button class="btn-hide" onclick="hideBook(${book.id})">Hide</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        window.toggleRead = function(id) {
            readStatus[id] = !readStatus[id];
            saveState();
            renderBooks();
        };

        window.hideBook = function(id) {
            hiddenStatus[id] = true;
            saveState();
            renderBooks();
        };

        window.toggleMin = function(id) {
            minStatus[id] = !minStatus[id];
            saveState();
            renderBooks();
        };

        window.toggleAllMinimize = function() {
            allMinimized = !allMinimized;
            books.forEach(book => { minStatus[book.id] = allMinimized; });
            saveState();
            renderBooks();
        };

        window.resetHidden = function() {
            hiddenStatus = {};
            saveState();
            renderBooks();
        };

        searchInput.addEventListener('input', renderBooks);
        renderBooks();
    </script>
</body>
</html>
