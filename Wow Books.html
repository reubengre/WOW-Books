<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoW Lore Reading Library</title>
<style>
:root {
--bg-color: #0d0f12;
--card-bg: #1a1c23;
--text-main: #e4d8c5;
--text-muted: #8e8c89;
--gold-accent: #c69b6d;
--gold-hover: #e3bc89;
--read-bg: #122119;
--read-border: #2e6642;
--danger: #8a2525;
--danger-hover: #ba3232;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: system-ui, -apple-system, sans-serif;
background-color: var(--bg-color);
color: var(--text-main);
padding: 16px;
line-height: 1.5;
}

header {
text-align: center;
margin-bottom: 24px;
}

h1 {
color: var(--gold-accent);
font-size: 1.5rem;
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 16px;
border-bottom: 1px solid var(--gold-accent);
padding-bottom: 8px;
}

.controls {
display: flex;
flex-direction: column;
gap: 12px;
margin-bottom: 24px;
}

input[type="text"] {
width: 100%;
padding: 12px;
background-color: var(--card-bg);
border: 1px solid var(--gold-accent);
border-radius: 4px;
color: var(--text-main);
font-size: 1rem;
}

input[type="text"]:focus {
outline: none;
border-color: var(--gold-hover);
}

.btn-reset {
background: none;
border: 1px solid var(--text-muted);
color: var(--text-muted);
padding: 8px;
border-radius: 4px;
cursor: pointer;
font-size: 0.9rem;
}

.book-list {
display: flex;
flex-direction: column;
gap: 16px;
}

.book-card {
display: flex;
background-color: var(--card-bg);
border: 1px solid #333;
border-radius: 8px;
overflow: hidden;
transition: all 0.3s ease;
}

.book-card.read {
background-color: var(--read-bg);
border-color: var(--read-border);
opacity: 0.85;
}

.book-cover {
width: 100px;
flex-shrink: 0;
background-color: #222;
}

.book-cover img {
width: 100%;
height: 100%;
object-fit: cover;
}

.book-info {
padding: 12px;
display: flex;
flex-direction: column;
flex-grow: 1;
}

.category-tag {
font-size: 0.75rem;
color: var(--gold-accent);
text-transform: uppercase;
margin-bottom: 4px;
}

.book-title {
font-size: 1.1rem;
font-weight: bold;
margin-bottom: 4px;
}

.book-rating {
font-size: 0.85rem;
color: var(--text-muted);
margin-bottom: 8px;
display: flex;
align-items: center;
gap: 4px;
}

.star {
color: var(--gold-accent);
}

.book-synopsis {
font-size: 0.85rem;
color: #b5b5b5;
margin-bottom: 12px;
flex-grow: 1;
}

.book-actions {
display: flex;
gap: 8px;
margin-top: auto;
}

button {
flex: 1;
padding: 8px;
border: none;
border-radius: 4px;
font-weight: bold;
font-size: 0.85rem;
cursor: pointer;
transition: background 0.2s;
}

.btn-read {
background-color: var(--gold-accent);
color: #000;
}

.btn-read:active {
background-color: var(--gold-hover);
}

.book-card.read .btn-read {
background-color: var(--read-border);
color: white;
}

.btn-hide {
background-color: var(--danger);
color: white;
}

.btn-hide:active {
background-color: var(--danger-hover);
}
</style>
</head>
<body>

<header>
<h1>WoW Reading Tracker</h1>
<div class="controls">
<input type="text" id="searchInput" placeholder="Search by title or category...">
<button class="btn-reset" onclick="resetHidden()">Show Hidden Books</button>
</div>
</header>

<main class="book-list" id="bookContainer"></main>

<script>
const books = [
{
id: 1, title: "Rise of the Horde", category: "The Foundations", rating: "4.21",
synopsis: "Before the Dark Portal opened, the Orcs were a shamanic society on Draenor. This novel details their tragic fall into bloodlust and demonic corruption orchestrated by the Burning Legion.",
cover: "https://placehold.co/150x225/1a1c23/c69b6d?text=Rise+of+the+Horde"
},
{
id: 2, title: "The Last Guardian", category: "The Foundations", rating: "4.12",
synopsis: "The wizard Medivh struggles against a dark presence within himself. His apprentice, Khadgar, must uncover his master's secrets as the Orcish Horde first pours into Azeroth.",
cover: "https://placehold.co/150x225/1a1c23/c69b6d?text=The+Last+Guardian"
},
{
id: 3, title: "Tides of Darkness", category: "The Foundations", rating: "4.15",
synopsis: "Following the fall of Stormwind, the survivors flee to Lordaeron to forge a grand Alliance, desperately fighting to halt the Orcish Horde's relentless march across the continent.",
cover: "https://placehold.co/150x225/1a1c23/c69b6d?text=Tides+of+Darkness"
},
{
id: 4, title: "The Well of Eternity", category: "Time Travel & Third War", rating: "4.20",
synopsis: "Modern heroes are cast 10,000 years into the past, arriving at the height of the Night Elf empire just as the Burning Legion begins its catastrophic first invasion of Azeroth.",
cover: "https://placehold.co/150x225/1a1c23/c69b6d?text=Well+of+Eternity"
},
{
id: 5, title: "Lord of the Clans", category: "Time Travel & Third War", rating: "4.26",
synopsis: "Raised as a gladiator slave by a human master, the young orc Thrall escapes to discover his heritage, master shamanism, and unite the scattered orc clans into a new Horde.",
cover: "https://placehold.co/150x225/1a1c23/c69b6d?text=Lord+of+the+Clans"
},
{
id: 6, title: "Arthas: Rise of the Lich King", category: "Time Travel & Third War", rating: "4.35",
synopsis: "Prince Arthas Menethil makes terrible sacrifices in an attempt to save his people from the undead plague, a tragic path that ultimately leads him to the Frozen Throne.",
cover: "https://placehold.co/150x225/1a1c23/c69b6d?text=Arthas"
},
{
id: 7, title: "The Shattering: Prelude to Cataclysm", category: "The MMO Era", rating: "4.05",
synopsis: "Azeroth is rocked by elemental unrest. As Thrall steps down as Warchief to heal the world, Garrosh Hellscream takes command, heightening tensions between the Horde and Alliance.",
cover: "https://placehold.co/150x225/1a1c23/c69b6d?text=The+Shattering"
},
{
id: 8, title: "Sylvanas", category: "The MMO Era", rating: "4.32",
synopsis: "An intimate look into the long, complex life and afterlife of the Banshee Queen, revealing the true motivations behind her most controversial actions leading into the Shadowlands.",
cover: "https://placehold.co/150x225/1a1c23/c69b6d?text=Sylvanas"
}
 ];

let readStatus = {};
let hiddenStatus = {};

const container = document.getElementById('bookContainer');
const searchInput = document.getElementById('searchInput');

function renderBooks() {
container.innerHTML = '';
const searchTerm = searchInput.value.toLowerCase();

books.forEach(book => {
if (hiddenStatus[book.id]) return;

if (book.title.toLowerCase().includes(searchTerm) ||
book.category.toLowerCase().includes(searchTerm)) {

const isRead = readStatus[book.id];

const card = document.createElement('div');
card.className = book-card ${isRead ? 'read' : ''}; card.innerHTML =
<div class="book-cover">
<img src="${book.cover}" alt="${book.title} cover">
</div>
<div class="book-info">
<div class="category-tag">${book.category}&lt;/div&gt; &lt;div class="book-title"&gt;${book.title}</div>
<div class="book-rating">
<span class="star">★</span> ${book.rating} / 5.00 (Goodreads) &lt;/div&gt; &lt;div class="book-synopsis"&gt;${book.synopsis}</div>
<div class="book-actions">
<button class="btn-read" onclick="toggleRead(${book.id})"&gt; ${isRead ? '✓ Read' : 'Mark as Read'}
</button>
<button class="btn-hide" onclick="hideBook(${book.id})"&gt;Hide&lt;/button&gt; &lt;/div&gt; &lt;/div&gt;;
container.appendChild(card);
}
});
}

function toggleRead(id) {
readStatus[id] = !readStatus[id];
renderBooks();
}

function hideBook(id) {
hiddenStatus[id] = true;
renderBooks();
}

function resetHidden() {
hiddenStatus = {};
renderBooks();
}

searchInput.addEventListener('input', renderBooks);
renderBooks();
</script>
</body>
</html>
