<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Background / Leather Cover with high squircle radius -->
    <rect width="512" height="512" rx="175" ry="175" fill="#20150e"/>
    <rect x="24" y="24" width="464" height="464" rx="150" ry="150" fill="#2b1d11" stroke="#c69b6d" stroke-width="10"/>
    
    <!-- Inner Gold Filigree / Border -->
    <rect x="55" y="55" width="402" height="402" rx="110" ry="110" fill="none" stroke="#c69b6d" stroke-width="4" opacity="0.8"/>
    
    <!-- Spine Line -->
    <path d="M 256 50 L 256 462" stroke="#100b07" stroke-width="16" opacity="0.5"/>
    
    <!-- Center Emblem Circle -->
    <circle cx="256" cy="256" r="110" fill="#15100a" stroke="#c69b6d" stroke-width="8"/>
    <circle cx="256" cy="256" r="95" fill="none" stroke="#c69b6d" stroke-width="2" stroke-dasharray="8 4"/>
    
    <!-- Glowing Core Emblem -->
    <text x="256" y="295" font-family="Georgia, serif" font-size="130" font-weight="bold" fill="#c69b6d" text-anchor="middle" filter="drop-shadow(0px 0px 10px #e3bc89)">W</text>
</svg>
